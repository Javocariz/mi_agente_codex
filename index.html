<html>
<head>
    <title>Reproductor de Música</title>
    <style>
        body {
            background-color: #212121;
            font-family: Arial, sans-serif;
            color: #fff;
        }
        .reproductor {
            width: 80%;
            margin: 40px auto;
            padding: 20px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }
        .botones {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }
        .boton {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #4CAF50;
            color: #fff;
            transition: background 0.3s ease;
        }
        .boton:hover {
            background: #3e8e41;
        }
        .comentarios {
            margin-top: 40px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div class="reproductor">
        <h1>Reproductor de Música</h1>
        <div class="botones">
            <button class="boton" id="reproducir">Reproducir</button>
            <button class="boton" id="pausar">Pausar</button>
        </div>
        <div class="comentarios">
            <h2>Comentarios</h2>
            <textarea placeholder="Escribe tu comentario aquí..."></textarea>
            <button class="boton" id="enviar">Enviar</button>
        </div>
    </div>
</body>
</html>
